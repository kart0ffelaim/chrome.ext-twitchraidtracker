<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Raid Tracker Settings</title>
    <link href="../theme.css" rel="stylesheet">
    <style>
        body {
            width: 380px;
            padding-bottom: 44px;
        }

        h3 {
            margin: 0 0 8px 2px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .card {
            margin-bottom: 18px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 12px;
            border-bottom: 1px solid var(--border);
        }

        .row:last-child {
            border-bottom: none;
        }

        label.row {
            cursor: pointer;
        }

        .row-text {
            min-width: 0;
        }

        .row-hint {
            display: block;
            margin-top: 1px;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* checkboxes are shown as switches */
        input[type="checkbox"] {
            appearance: none;
            flex-shrink: 0;
            position: relative;
            width: 34px;
            height: 20px;
            margin: 0;
            border-radius: 999px;
            background: var(--border);
            cursor: pointer;
            transition: background-color 0.15s;
        }

        input[type="checkbox"]::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s;
        }

        input[type="checkbox"]:checked {
            background: var(--accent);
        }

        input[type="checkbox"]:checked::after {
            transform: translateX(14px);
        }

        input[type="number"] {
            flex-shrink: 0;
            width: 64px;
            text-align: right;
        }

        .row.stacked {
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
        }

        .row.stacked .inline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .row.stacked label.inline {
            justify-content: flex-start;
            gap: 8px;
            cursor: pointer;
        }

        input[type="file"] {
            width: 100%;
            font: inherit;
            font-size: 12px;
            color: var(--text-muted);
        }

        input[type="file"]::file-selector-button {
            font: inherit;
            font-weight: 600;
            margin-right: 10px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-small);
            background: var(--surface-raised);
            color: var(--text);
            cursor: pointer;
        }

        #status {
            position: fixed;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            max-width: calc(100% - 28px);
            padding: 7px 14px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--on-accent);
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            box-shadow: var(--shadow);
        }

        #status:empty {
            display: none;
        }

        /*noinspection CssUnusedSymbol*/
        .loader {
            width: 90px;
            height: 14px;
            box-shadow: 0 3px 0 var(--text);
            position: relative;
            clip-path: inset(-40px 0 -5px)
        }

        /*noinspection CssUnusedSymbol*/
        .loader:before {
            content: "";
            position: absolute;
            inset: auto calc(50% - 17px) 0;
            height: 50px;
            --g: no-repeat linear-gradient(var(--accent) 0 0);
            background: var(--g), var(--g), var(--g), var(--g);
            background-size: 16px 14px;
            animation: l7-1 2s infinite linear,
            l7-2 2s infinite linear;
        }

        @keyframes l7-1 {
            0%,
            100% {
                background-position: 0 -50px, 100% -50px
            }
            17.5% {
                background-position: 0 100%, 100% -50px, 0 -50px, 100% -50px
            }
            35% {
                background-position: 0 100%, 100% 100%, 0 -50px, 100% -50px
            }
            52.5% {
                background-position: 0 100%, 100% 100%, 0 calc(100% - 16px), 100% -50px
            }
            70%,
            98% {
                background-position: 0 100%, 100% 100%, 0 calc(100% - 16px), 100% calc(100% - 16px)
            }
        }

        @keyframes l7-2 {
            0%, 70% {
                transform: translate(0)
            }
            100% {
                transform: translate(200%)
            }
        }
    </style>
</head>
<body>
<h3>Tracking</h3>
<div class="card">
    <label class="row">
        <span class="row-text">Track raids seen in chat
            <span class="row-hint">Raids arriving at the channel you are watching</span>
        </span>
        <input id="track-passive" type="checkbox">
    </label>
    <label class="row">
        <span class="row-text">Delete old raids after
            <span class="row-hint">Months, 0 keeps raids forever</span>
        </span>
        <input id="retention-months" min="0" type="number">
    </label>
</div>

<h3>Display</h3>
<div class="card">
    <label class="row">
        <span class="row-text">Count raids seen in chat
            <span class="row-hint">In the tooltip and on the extension icon</span>
        </span>
        <input id="show-passive-tooltip" type="checkbox">
    </label>
    <label class="row">
        <span class="row-text">Raid count on the extension icon
            <span class="row-hint">Raids to the channel of the current tab</span>
        </span>
        <input id="show-badge" type="checkbox">
    </label>
    <label class="row">
        <span class="row-text">Raids in the tooltip on twitch.tv</span>
        <input id="tooltip-item-number" min="1" type="number">
    </label>
    <label class="row">
        <span class="row-text">Raids per page in the popup</span>
        <input id="overview-page-size" min="1" type="number">
    </label>
</div>

<h3>Data</h3>
<div class="card">
    <div class="row stacked">
        <span class="row-text">Import raids
            <span class="row-hint">JSON file created by the export</span>
        </span>
        <input accept="application/json" aria-label="File to import" id="import-file" type="file">
        <div class="inline">
            <label class="inline">
                <input id="import-mode" type="checkbox"> Keep existing raids
            </label>
            <button class="primary" id="import-data">Import</button>
        </div>
    </div>
    <div class="row">
        <span class="row-text">Export raids
            <span class="row-hint">Download all raids as JSON file</span>
        </span>
        <button id="export-data">Export</button>
    </div>
    <div class="row">
        <span class="row-text">Delete all raids
            <span class="row-hint">This can not be undone</span>
        </span>
        <button class="danger" id="clear-btn">Delete</button>
    </div>
</div>

<h3>Advanced</h3>
<div class="card">
    <label class="row">
        <span class="row-text">Debug logging
            <span class="row-hint">Writes detailed logs to the console</span>
        </span>
        <input id="debug-mode" type="checkbox">
    </label>
</div>

<div id="status" role="status"></div>
<script src="options.js" type="module"></script>
</body>
</html>
